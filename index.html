<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yonkodo Member Registration</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#1d1d1f;--mut:#6b6b73;--p:#5B1A5E;--o:#E4502F;--card:#faf5fa;--bd:#d9c9da;--in:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121a;--fg:#f1eaf2;--mut:#b5a8b8;--p:#b46bb8;--card:#241b28;--bd:#4a3a4e;--in:#1c1520}}
:root[data-theme="dark"]{--bg:#17121a;--fg:#f1eaf2;--mut:#b5a8b8;--p:#b46bb8;--card:#241b28;--bd:#4a3a4e;--in:#1c1520}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 Arial,Helvetica,sans-serif}
main{max-width:920px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--o);padding-bottom:10px}
header img{height:64px;flex-shrink:0}
h1{font-size:20px;margin:0;color:var(--p)}header small{color:var(--o);font-weight:bold}
nav{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--p);background:var(--in);color:var(--p);padding:8px 14px;border-radius:8px;cursor:pointer}
button.on,button.pri{background:var(--p);color:#fff}
button.del{border-color:#c0392b;color:#c0392b}
section{border:1px solid var(--bd);border-radius:10px;margin:14px 0;background:var(--card)}
section>h2{margin:0;padding:8px 12px;font-size:15px;background:var(--p);color:#fff;border-radius:9px 9px 0 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;padding:12px}
.f label,.t th{font-size:12px;font-weight:bold;color:var(--mut);display:block;margin-bottom:3px}
.wide{grid-column:1/-1}
input[type=text],input:not([type]),input[type=date],input[type=number],input[type=email],input[type=tel],input[type=password],select,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--in);color:var(--fg)}
.ck{display:flex;flex-wrap:wrap;gap:6px 16px}.ck label,.ag{font-size:14px;font-weight:normal;color:var(--fg)}
.note{padding:10px 12px;color:var(--mut);font-size:13px}
.tw{overflow-x:auto;padding:8px 12px}.t{width:100%;border-collapse:collapse;min-width:520px}.t td,.t th{padding:3px;text-align:left}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
#msg{position:sticky;top:6px;z-index:5;padding:10px;border-radius:8px;background:#2e7d32;color:#fff;display:none}#msg.err{background:#c0392b}
.rt{width:100%;border-collapse:collapse}.rt th,.rt td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.v dt{font-size:12px;color:var(--mut);font-weight:bold}.v dd{margin:0 0 8px;white-space:pre-wrap}
.v dl{padding:10px 12px;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 12px}
.hide{display:none!important}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}}
</style></head><body><main>
